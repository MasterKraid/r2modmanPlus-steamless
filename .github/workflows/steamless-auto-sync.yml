name: Steamless Auto-Sync and Build

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config --global user.name "Kraid (Automation)"
          git config --global user.email "kraid-auto@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/ebkr/r2modmanPlus.git
          git fetch upstream develop

      - name: Merge Upstream (Auto-Resolve Conflicts)
        run: |
          # The -X ours strategy tells git: if a conflict occurs on a line, pick OUR version (Steamless).
          # This ensures our rebranding and Steamless logic won't be overwritten by upstream updates.
          git merge upstream/develop --no-edit -X ours || (echo "Warning: Major structural changes detected. Manual review recommended but continuing..." && git add . && git commit -m "Auto-resolved structural conflicts")

      - name: Push Merged Changes
        run: |
          git push origin develop --force # Ensure develop is always up to date with merged code

      - name: Install Dependencies
        run: |
          corepack enable
          yarn install

      - name: Build Windows
        run: |
          yarn run build-win

      - name: Extract Version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Fetch Upstream Release Notes
        id: get_notes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          UPSTREAM_NOTES=$(gh release view --repo ebkr/r2modmanPlus --json body --jq '.body')
          STEAMLESS_NOTES="## r2modman Steamless v${{ steps.get_version.outputs.VERSION }}\n\nThis is a platform-agnostic, store-independent fork of the original r2modmanPlus by ebkr.\n\n### Steamless Features:\n- Bypass Steam/Epic/GOG DRM and store launching requirements.\n- Force Steamless launching via the \"Start Modded\" dropdown.\n- Fully rebranded UI and direct-launch awareness.\n\n---\n\n### Original Release Notes (from upstream/ebkr):\n\n$UPSTREAM_NOTES"
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo -e "$STEAMLESS_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: r2modman Steamless v${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.get_notes.outputs.NOTES }}
          files: |
            dist/electron/Packaged/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
