name: Steamless Auto-Sync and Build

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    name: Sync with Upstream
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      notes: ${{ steps.get_notes.outputs.NOTES }}
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "Kraid (Automation)"
          git config --global user.email "kraid-auto@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/ebkr/r2modmanPlus.git
          git fetch upstream develop

      - name: Merge Upstream (Auto-Resolve Conflicts)
        run: |
          git merge upstream/develop --no-edit -X ours || (echo "Warning: Major structural changes detected." && git add . && git commit -m "Auto-resolved structural conflicts")

      - name: Push Merged Changes
        run: |
          git push origin develop --force

      - name: Extract Version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Fetch Upstream Release Notes
        id: get_notes
        run: |
          UPSTREAM_NOTES=$(gh release view --repo ebkr/r2modmanPlus --json body --jq '.body')
          STEAMLESS_NOTES="## r2modman Steamless v${{ steps.get_version.outputs.VERSION }}\n\nThis is a platform-agnostic, store-independent fork of the original r2modmanPlus by ebkr.\n\n### Steamless Features:\n- Bypass Steam/Epic/GOG DRM and store launching requirements.\n- Force Steamless launching via the \"Start Modded\" dropdown.\n- Fully rebranded UI and direct-launch awareness.\n\n---\n\n### Original Release Notes (from upstream/ebkr):\n\n$UPSTREAM_NOTES"
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo -e "$STEAMLESS_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

  build:
    name: Build (${{ matrix.os }})
    needs: sync
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: yarn run build-win
          - os: ubuntu-latest
            build_cmd: yarn run build-linux
          - os: macos-latest
            build_cmd: yarn run build-osx
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          corepack enable
          yarn install

      - name: Build Application
        run: ${{ matrix.build_cmd }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.sync.outputs.version }}
          name: r2modman Steamless v${{ needs.sync.outputs.version }}
          body: ${{ needs.sync.outputs.notes }}
          files: |
            dist/electron/Packaged/*.exe
            dist/electron/Packaged/*.AppImage
            dist/electron/Packaged/*.deb
            dist/electron/Packaged/*.rpm
            dist/electron/Packaged/*.dmg
            dist/electron/Packaged/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload Build Artifacts (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: r2modman-steamless-builds-${{ matrix.os }}
          path: dist/electron/Packaged/*.*
